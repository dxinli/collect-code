name: plan-guard
on: pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block code commits while plan-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          LABELS=$(gh pr view "$PR_NUMBER" -R "$REPO" --json labels \
            --jq '[.labels[].name] | join(",")')
          if [[ "$LABELS" != *plan-review* ]]; then
            echo "✅ 非 plan-review 状态，跳过检查"; exit 0
          fi

          # 获取本 PR 相对 base 的所有 commit
          COMMITS=$(gh pr view "$PR_NUMBER" -R "$REPO" \
            --json commits --jq '.commits[].messageHeadline')

          # 白名单：空认领 commit 和纯文档 commit 允许
          BAD=$(echo "$COMMITS" | grep -vE \
            '^chore: claim ticket|^docs:|^\[plan' || true)

          if [ -n "$BAD" ]; then
            echo "::error::plan-review 期间出现代码 commit：$BAD"
            exit 1
          fi
