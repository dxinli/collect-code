name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC_BASE: origin/${{ github.base_ref || 'main' }}
      SPEC_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check CI scope coverage
        run: ./scripts/ci-scope.sh --check-top-level

      - name: Detect changed areas
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-scope.sh --event "$EVENT" --base "$BASE" --head "$HEAD" --github-output

      - name: Set up Go
        if: steps.scope.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        if: steps.scope.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./...

      - name: Run Go checks
        if: steps.scope.outputs.go == 'true'
        run: make check-go

      - name: Run spec checks
        if: steps.scope.outputs.spec == 'true'
        run: make check-spec
