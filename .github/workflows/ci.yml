name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC_BASE: origin/${{ github.base_ref || 'main' }}
      SPEC_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Detect .scratch-only change
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "$SPEC_BASE"...HEAD)"
          docs_only=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              .scratch/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        if: steps.scope.outputs.docs_only != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run make ci
        if: steps.scope.outputs.docs_only != 'true'
        run: make ci

      # The tickets-sync bot only touches .scratch/; keep its PR fast while
      # still reporting the required "ci" check.
      - name: Run ticket checks
        if: steps.scope.outputs.docs_only == 'true'
        run: make tickets-ci
