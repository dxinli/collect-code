name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number（record-dispatch 转发时带上；guard 据此解析 head/base）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SPEC_BASE: origin/${{ github.base_ref || 'main' }}
      SPEC_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./...

      - name: Run Go checks
        run: make check-go

      - name: Run spec checks
        run: make check-spec

  guard:
    name: guard
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pull_request 事件用事件负载；workflow_dispatch（record-dispatch 转发）
      # 没有 PR 上下文，用 gh 按 pr 输入解析。两路径汇合到同一校验段。
      - name: Resolve PR refs
        env:
          EVENT: ${{ github.event_name }}
          EV_BASE: ${{ github.event.pull_request.base.sha }}
          EV_HEAD: ${{ github.event.pull_request.head.sha }}
          EV_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::workflow_dispatch 需要 pr 输入（record-dispatch 转发时自动带上）"
              exit 1
            fi
            EV_BASE=$(gh pr view "$PR_NUMBER" -R "$REPO" --json baseRefOid --jq .baseRefOid)
            EV_BRANCH=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefName --jq .headRefName)
            EV_HEAD=$(git rev-parse HEAD)
          fi
          {
            echo "BASE=$EV_BASE"
            echo "HEAD=$EV_HEAD"
            echo "BRANCH=$EV_BRANCH"
          } >> "$GITHUB_ENV"

      - name: Enforce plan rules
        env:
          APPROVER: ${{ github.repository_owner }}
        run: |
          . scripts/path-policy.sh

          if ! FILES=$(git -c core.quotePath=false diff --name-only "$BASE...$HEAD"); then
            echo "::error::cannot compute changed files"
            exit 1
          fi
          CODE=$(printf '%s\n' "$FILES" | grep -vE "$PLAN_ALLOW_RE" || true)

          if [ -z "$CODE" ]; then
            echo "✅ 只有计划文件，无需 plan 通过记录"
            exit 0
          fi

          case "$BRANCH" in
            spec-delta/*|dependabot/*|probe/*)
              echo "✅ 豁免分支：$BRANCH"
              exit 0
              ;;
          esac

          if ! COMMENTS=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"$APPROVER\") | .body"); then
            echo "::error::cannot read PR comments"
            exit 1
          fi
          if ! REVIEWS=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq ".[] | select(.user.login == \"$APPROVER\") | select(.state == \"COMMENTED\" or .state == \"APPROVED\") | .body"); then
            echo "::error::cannot read PR reviews"
            exit 1
          fi
          # 记录正则与 scripts/pr-comments.sh 保持同步（ADR-0012 决策 7）。
          RECORDS=$(printf '%s\n%s\n' "$COMMENTS" "$REVIEWS" | tr -d '\r' \
            | grep -oE '^/plan-approved [0-9a-f]{7,40}[[:space:]]*$' \
            | awk '{print $2}' || true)
          if [ -z "$RECORDS" ]; then
            echo "::error::代码改动需要计划通过记录：由 reviewer 在 PR 评论 '/plan-approved <sha>'（<sha> 为计划阶段的 commit）"
            exit 1
          fi

          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "… $sha：不在本地历史中，跳过"
              continue
            fi
            if ! git merge-base --is-ancestor "$sha" "$HEAD"; then
              echo "… $sha：不是 PR head 的祖先，跳过"
              continue
            fi
            if git merge-base --is-ancestor "$sha" "$BASE"; then
              echo "… $sha：属于 base 历史，不是本 PR 的计划提交，跳过"
              continue
            fi
            if ! PHASE_FILES=$(git -c core.quotePath=false diff --name-only "$BASE...$sha"); then
              echo "… $sha：无法计算记录点的 diff，跳过"
              continue
            fi
            PHASE_CODE=$(printf '%s\n' "$PHASE_FILES" | grep -vE "$PLAN_ALLOW_RE" || true)
            if [ -n "$PHASE_CODE" ]; then
              echo "… $sha：记录点已包含代码文件，跳过"
              continue
            fi
            echo "✅ plan 通过记录有效：$sha"
            exit 0
          done <<< "$RECORDS"

          echo "::error::没有有效的计划通过记录；reviewer 需在计划 commit 上评论 '/plan-approved <sha>'"
          exit 1

      - name: Require ticket metadata
        run: |
          . scripts/path-policy.sh
          SKIP_CLOSES=0
          case "$BRANCH" in
            dependabot/*|probe/*)
              echo "✅ 豁免分支：$BRANCH"
              exit 0
              ;;
            spec-delta/*)
              SKIP_CLOSES=1
              echo "spec-delta：跳过 Closes/issue 校验，仍校验 Spec-* 与 REQ"
              ;;
          esac

          if ! BODY=$(gh pr view "$PR_NUMBER" -R "$REPO" --json body --jq .body); then
            echo "::error::cannot read PR body"
            exit 1
          fi
          BODY=$(printf '%s' "$BODY" | tr -d '\r')
          BODY_CLEAN=$(printf '%s\n' "$BODY" | awk '
            /^[[:space:]]*(```|~~~)/ { fence = !fence; next }
            !fence { print }
          ')

          field() {
            printf '%s\n' "$BODY_CLEAN" \
              | sed -nE "s/^[[:space:]]*[-*]?[[:space:]]*\*\*$1:\*\*[[:space:]]*(.*)$/\1/p" \
              | head -n1 \
              | sed -E 's/[[:space:]]+$//'
          }

          if [ "$SKIP_CLOSES" -eq 0 ]; then
            CLOSES_ANY=$(printf '%s\n' "$BODY_CLEAN" \
              | grep -icE '^[[:space:]]*(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+[[:space:]]*$' || true)
            CLOSES=$(printf '%s\n' "$BODY_CLEAN" \
              | grep -cE '^[[:space:]]*Closes[[:space:]]+#[0-9]+[[:space:]]*$' || true)
            if [ "$CLOSES_ANY" -ne 1 ] || [ "$CLOSES" -ne 1 ]; then
              echo "::error::PR 正文必须有且只有一行 'Closes #<issue>'；其他关闭关键字（Fixes/Resolves 等）或第二条关闭引用会被拒绝"
              exit 1
            fi
            ISSUE=$(printf '%s\n' "$BODY_CLEAN" \
              | sed -nE 's/^[[:space:]]*Closes[[:space:]]+#([0-9]+)[[:space:]]*$/\1/p' \
              | head -n1)
            ISSUE=$(printf '%s' "$ISSUE" | sed -E 's/^0+//')
            [ -n "$ISSUE" ] || ISSUE=0
            if [ "$ISSUE" = "71" ]; then
              echo "::error::不能把 spec anchor #71 作为 Closes 目标"
              exit 1
            fi

            if ! ISSUE_STATE=$(gh api "repos/$REPO/issues/$ISSUE" --jq .state) \
              || ! ISSUE_IS_PR=$(gh api "repos/$REPO/issues/$ISSUE" --jq 'if .pull_request then "yes" else "no" end') \
              || ! ISSUE_BODY=$(gh api "repos/$REPO/issues/$ISSUE" --jq '.body // ""'); then
              echo "::error::cannot read issue #$ISSUE"
              exit 1
            fi
            ISSUE_BODY=$(printf '%s' "$ISSUE_BODY" | tr -d '\r')
            if [ "$ISSUE_STATE" != "open" ]; then
              echo "::error::Closes #$ISSUE 指向的 issue 不是 open"
              exit 1
            fi
            if [ "$ISSUE_IS_PR" = "yes" ]; then
              echo "::error::Closes #$ISSUE 指向的是 PR，不是 ticket issue"
              exit 1
            fi
            if ! printf '%s\n' "$ISSUE_BODY" \
              | grep -qE '^\*\*Ticket:\*\*[[:space:]]+[^<[:space:]]'; then
              echo "::error::issue #$ISSUE 缺少真实的 **Ticket:** 行"
              exit 1
            fi
          fi

          SPEC_VERSION=$(field 'Spec-Version' | sed -E 's/[`[:space:]]//g')
          SPEC_IMPACT=$(field 'Spec-Impact' | sed -E 's/[`[:space:]]//g' | tr '[:upper:]' '[:lower:]')
          REQ=$(field 'REQ')
          [ -n "$SPEC_VERSION" ] || { echo "::error::PR 正文缺少 **Spec-Version:**"; exit 1; }
          [ -n "$SPEC_IMPACT" ] || { echo "::error::PR 正文缺少 **Spec-Impact:**"; exit 1; }
          [ -n "$REQ" ] || { echo "::error::PR 正文缺少 **REQ:**"; exit 1; }

          FILE_VERSION=$(tr -d '[:space:]' < docs/spec/VERSION)
          if [ "$SPEC_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Spec-Version=$SPEC_VERSION 与 docs/spec/VERSION=$FILE_VERSION 不一致"
            exit 1
          fi
          case "$SPEC_IMPACT" in
            none|patch|minor|major) ;;
            *)
              echo "::error::Spec-Impact 必须是 none|patch|minor|major，当前 '$SPEC_IMPACT'"
              exit 1
              ;;
          esac

          if ! FILES=$(git -c core.quotePath=false diff --name-only "$BASE...$HEAD"); then
            echo "::error::cannot compute changed files"
            exit 1
          fi
          SPEC_CHANGED=$(printf '%s\n' "$FILES" | grep -E "$SPEC_DELTA_ALLOW_RE" || true)
          if [ -n "$SPEC_CHANGED" ] && [ "$SPEC_IMPACT" = "none" ]; then
            echo "::error::改了规范包却写 Spec-Impact: none"
            printf '%s\n' "$SPEC_CHANGED"
            exit 1
          fi

          REQ_CLEAN=$(printf '%s' "$REQ" | sed -E 's/`//g' | tr -s '[:space:]' ' ' | sed -E 's/^ +| +$//g')
          REQ_LC=$(printf '%s' "$REQ_CLEAN" | tr '[:upper:]' '[:lower:]')
          if [ "$REQ_LC" != "none" ]; then
            REQ_TOKENS=$(printf '%s\n' "$REQ_CLEAN" \
              | sed -E 's/[，,；;、。]+/\n/g' \
              | tr -s '[:space:]' '\n' \
              | sed '/^$/d')
            if [ -z "$REQ_TOKENS" ]; then
              echo "::error::REQ 不能为空或只有分隔符"
              exit 1
            fi
            BAD_REQ=$(printf '%s\n' "$REQ_TOKENS" \
              | grep -vE '^(REQ-[A-Z]+-[0-9]{2}(\.\.|/)[0-9]{2}|REQ-[A-Z]+-[0-9]{2}|(EXT|STORE|SIM)-[A-Z0-9]+-[0-9]{2}|CFG-[A-Z0-9]+(-[0-9]{2})?)$' || true)
            if [ -n "$BAD_REQ" ]; then
              echo "::error::REQ 含无法识别的锚点："
              printf '%s\n' "$BAD_REQ"
              exit 1
            fi
          fi

          if [ "$SKIP_CLOSES" -eq 1 ]; then
            echo "✅ spec-delta：Spec-Version、Spec-Impact、REQ 校验通过"
          else
            echo "✅ ticket #$ISSUE、Spec-Version、Spec-Impact、REQ 校验通过"
          fi

      - name: Require code review approval
        env:
          APPROVER: ${{ github.repository_owner }}
        run: |
          case "$BRANCH" in
            dependabot/*|probe/*)
              echo "✅ 豁免分支：$BRANCH"
              exit 0
              ;;
          esac

          if ! IS_DRAFT=$(gh pr view "$PR_NUMBER" -R "$REPO" --json isDraft --jq .isDraft); then
            echo "::error::cannot read PR draft state"
            exit 1
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::draft PR：code review 门禁在 ready 后生效；不要对 draft 开 auto-merge"
            exit 1
          fi

          if ! LIVE_HEAD=$(gh pr view "$PR_NUMBER" -R "$REPO" --json headRefOid --jq .headRefOid); then
            echo "::error::cannot read PR head"
            exit 1
          fi
          if [ "$HEAD" != "$LIVE_HEAD" ]; then
            echo "::error::本次 run 的 head 是 $HEAD，当前 PR head 是 $LIVE_HEAD；请在最新 head 上重新运行"
            exit 1
          fi

          if ! COMMENTS=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"$APPROVER\") | .body"); then
            echo "::error::cannot read PR comments"
            exit 1
          fi
          if ! REVIEWS=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq ".[] | select(.user.login == \"$APPROVER\") | select(.state == \"COMMENTED\" or .state == \"APPROVED\") | .body"); then
            echo "::error::cannot read PR reviews"
            exit 1
          fi
          # 记录正则与 scripts/pr-comments.sh 保持同步（ADR-0012 决策 7）。
          RECORDS=$(printf '%s\n%s\n' "$COMMENTS" "$REVIEWS" | tr -d '\r' \
            | grep -oE '^/code-approved [0-9a-f]{7,40}[[:space:]]*$' \
            | awk '{print $2}' || true)
          if [ -z "$RECORDS" ]; then
            echo "::error::非 draft PR 需要当前 head 的 code review 记录：reviewer 评论 '/code-approved <head-sha>'（会话评论或 COMMENTED/APPROVED review 正文）；记录评论会自动触发放行 CI（record-dispatch）"
            exit 1
          fi

          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            if ! resolved=$(git rev-parse --verify "$sha^{commit}" 2>/dev/null); then
              echo "… $sha：无法解析为 commit，跳过"
              continue
            fi
            if [ "$resolved" != "$HEAD" ]; then
              echo "… $sha：不是当前 head（$HEAD），跳过"
              continue
            fi
            echo "✅ code review 记录有效：$resolved"
            exit 0
          done <<< "$RECORDS"

          echo "::error::没有当前 head（$HEAD）的 code review 记录；reviewer 需评论 '/code-approved $HEAD'，记录评论会自动触发放行 CI（record-dispatch）"
          exit 1

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
